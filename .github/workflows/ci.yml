name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: command -v xcodegen || brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -quiet -project AgentUsage.xcodeproj -scheme AgentUsage -destination 'platform=macOS' -derivedDataPath .xcode-derived test CODE_SIGNING_ALLOWED=NO
      - run: ./scripts/package-app.sh
      - run: ./scripts/check-claude-capture.sh
